# FutureAcad — nginx site config.
# Install to /etc/nginx/sites-available/futureacad and symlink into sites-enabled.
# certbot --nginx rewrites this file to add the TLS listeners and redirect.

upstream futureacad_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name futureacad.ae www.futureacad.ae;

    # Lead messages are capped at 4000 chars; 1 MB is plenty and blunts abuse.
    client_max_body_size 1m;

    access_log /var/log/nginx/futureacad.access.log;
    error_log  /var/log/nginx/futureacad.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # --- Static assets: served by nginx, never by gunicorn ---
    # Hashless filenames, so keep the window short enough to allow updates.
    location /static/ {
        alias /var/www/futureacad/current/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Video changes rarely — cache it harder. A prefix location (not a regex)
    # so `alias` resolves correctly and byte-range requests still work.
    location /static/video/ {
        alias /var/www/futureacad/current/app/static/video/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Browsers request /favicon.ico unprompted; the site ships a PNG.
    location = /favicon.ico {
        alias /var/www/futureacad/current/app/static/img/favicon.png;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /var/www/futureacad/current/app/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # --- Application ---
    location / {
        proxy_pass http://futureacad_app;
        proxy_http_version 1.1;

        # ProxyFix (PROXY_HOPS=1) reads these to recover the real client + scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health endpoint stays local-only; keeps monitoring noise out of the logs.
    location = /healthz {
        proxy_pass http://futureacad_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
